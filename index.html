<!DOCTYPE html>
<html lang="es">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Samahani Cotizador</title>


  <!-- FUENTE YESEVA ONE -->

  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  >

  <link
    href="https://fonts.googleapis.com/css2?family=Yeseva+One&display=swap"
    rel="stylesheet"
  >


  <style>

    /* =========================
       CONFIGURACIÓN GENERAL
    ========================= */

    * {
      box-sizing: border-box;
    }


    body {

      margin: 0;

      min-height: 100vh;

      display: flex;
      flex-direction: column;

      align-items: center;

      font-family: "Yeseva One", serif;


      /* IMAGEN DE FONDO */

      background-image: url("fondo.png");

      background-size: cover;

      background-position: center top;

      background-repeat: no-repeat;

      background-attachment: fixed;


      padding: 30px 20px 180px;

    }



    /* =========================
       IMAGEN DE DECORACIÓN
       LOGO + PERSONAJE
    ========================= */

    .decoracion {

      width: 100%;

      max-width: 700px;

      display: flex;

      justify-content: center;

      margin-bottom: 10px;

    }


    .decoracion img {

      width: 100%;

      max-width: 650px;

      height: auto;

      display: block;

    }



    /* =========================
       CONTENEDOR DE LA MANZANA
    ========================= */

    .manzana {

      position: relative;

      width: 100%;

      max-width: 520px;

      margin-top: 70px;

    }



    /* =========================
       TALLO
    ========================= */

    .manzana::before {

      content: "";

      position: absolute;

      width: 38px;

      height: 100px;

      background: linear-gradient(
        90deg,
        #5a260e,
        #8a461d,
        #4b1e0b
      );

      top: -75px;

      left: 50%;

      transform:
        translateX(-50%)
        rotate(-18deg);

      border-radius: 20px;

      z-index: 1;

    }



    /* =========================
       HOJA
    ========================= */

    .manzana::after {

      content: "";

      position: absolute;

      width: 140px;

      height: 75px;

      background: linear-gradient(
        135deg,
        #79a82a,
        #356f0c
      );

      top: -60px;

      left: 50%;

      margin-left: 5px;

      border-radius:
        100% 0
        100% 0;

      transform: rotate(-25deg);

      z-index: 1;

    }



    /* =========================
       CUERPO DE LA MANZANA
    ========================= */

    .cotizador {

      position: relative;

      width: 100%;

      min-height: 600px;

      padding:
        110px
        45px
        60px;

      text-align: center;


      /*
      ROJO DE LA MANZANA
      */

      background:

        radial-gradient(
          circle at 30% 20%,
          #ff5b5b,
          #d81f1f 35%,
          #a81010 75%
        );


      /*
      FORMA DE MANZANA
      */

      border-radius:

        42% 42%
        48% 48%

        /

        35% 35%
        55% 55%;


      box-shadow:

        inset
        12px
        12px
        25px
        rgba(255,255,255,0.18),

        inset
        -15px
        -15px
        30px
        rgba(90,0,0,0.35),

        0
        20px
        35px
        rgba(0,0,0,0.25);


      border:

        8px
        solid
        #b51515;


      overflow: hidden;

    }



    /* =========================
       BRILLO DE LA MANZANA
    ========================= */

    .cotizador::before {

      content: "";

      position: absolute;

      width: 180px;

      height: 350px;

      background:

        linear-gradient(
          90deg,

          rgba(255,255,255,0.35),

          rgba(255,255,255,0)

        );

      top: 70px;

      left: 30px;

      border-radius: 50%;

      transform: rotate(15deg);

      pointer-events: none;

    }



    /* =========================
       PANEL INTERNO CREMA
    ========================= */

    .panel {

      position: relative;

      z-index: 2;

      width: 100%;

      padding: 35px 25px;

      background:

        rgba(
          255,
          252,
          240,
          0.97
        );


      border-radius:

        30px;

      box-shadow:

        0
        10px
        25px
        rgba(0,0,0,0.15);

    }



    /* =========================
       INPUT
    ========================= */

    .input-usd {

      width: 100%;

      padding: 18px;

      border:

        3px
        solid
        #9b2420;

      border-radius: 18px;

      background: white;

      color: #333;

      font-family:
        "Yeseva One",
        serif;

      font-size: 20px;

      text-align: center;

      outline: none;

      transition: 0.2s;

    }


    .input-usd::placeholder {

      color: #999;

    }


    .input-usd:focus {

      border-color: #4d7c14;

      box-shadow:

        0
        0
        0
        4px

        rgba(
          77,
          124,
          20,
          0.15
        );

    }



    /* =========================
       BOTÓN VERDE
    ========================= */

    button {

      width: 100%;

      margin-top: 20px;

      padding: 18px;

      border: none;

      border-radius: 18px;


      background:

        linear-gradient(
          135deg,
          #639b1c,
          #3f7010
        );


      color: white;

      font-family:
        "Yeseva One",
        serif;

      font-size: 20px;

      cursor: pointer;


      box-shadow:

        0
        7px
        0
        #2d500a,

        0
        10px
        20px
        rgba(0,0,0,0.15);


      transition:

        transform 0.15s,

        box-shadow 0.15s;

    }


    button:hover {

      transform:
        translateY(-2px);

    }


    button:active {

      transform:
        translateY(4px);


      box-shadow:

        0
        3px
        0
        #2d500a;

    }



    /* =========================
       RESULTADO BORDÓ
    ========================= */

    .resultado {

      margin-top: 30px;

      padding: 28px 15px;

      background:

        rgba(
          255,
          255,
          255,
          0.8
        );


      border:

        2px
        dashed
        #8e1b1b;


      border-radius: 25px;


      color:
        #8e1b1b;


      font-size: 38px;

      font-weight: bold;

      display: none;

      word-break: break-word;

    }



    /* =========================
       ERROR
    ========================= */

    .error {

      margin-top: 20px;

      color:
        #8e1b1b;

      font-family:
        Arial,
        sans-serif;

      font-size: 16px;

      font-weight: bold;

      display: none;

    }



    /* =========================
       CELULAR
    ========================= */

    @media (max-width: 550px) {


      body {

        padding:
          20px
          15px
          160px;

      }


      .manzana {

        margin-top: 50px;

      }


      .cotizador {

        min-height: 540px;

        padding:

          90px
          25px
          45px;

        border-width:
          6px;

      }


      .manzana::after {

        width: 100px;

        height: 55px;

      }


      .panel {

        padding:
          25px
          18px;

      }


      .resultado {

        font-size:
          30px;

      }

    }

  </style>

</head>


<body>


  <!-- =========================
       IMAGEN DECORATIVA
    ========================= -->

  <div class="decoracion">

    <img
      src="decoracion.png"
      alt="Samahani Cotizador"
    >

  </div>



  <!-- =========================
       MANZANA
    ========================= -->

  <div class="manzana">


    <div class="cotizador">


      <div class="panel">


        <!-- INPUT -->

        <input

          type="number"

          id="precioUSD"

          class="input-usd"

          placeholder="Precio en USD"

          min="0"

          step="0.01"

        >



        <!-- BOTÓN -->

        <button
          onclick="cotizar()"
        >

          COTIZAR

        </button>



        <!-- ERROR -->

        <div
          id="error"
          class="error"
        >

          Ingresá un precio válido.

        </div>



        <!-- RESULTADO -->

        <div
          id="resultado"
          class="resultado"
        >

        </div>


      </div>


    </div>


  </div>



  <script>


    function cotizar() {


      const precio = parseFloat(

        document
          .getElementById(
            "precioUSD"
          )
          .value

      );


      /*
      ====================

      CONFIGURACIÓN

      ====================
      */


      const fees = 3.50;

      const dolar = 1530;



      const resultado =

        document
          .getElementById(
            "resultado"
          );


      const error =

        document
          .getElementById(
            "error"
          );



      /*
      VALIDAR PRECIO
      */


      if (

        isNaN(precio)

        ||

        precio <= 0

      ) {


        resultado.style.display =
          "none";


        error.style.display =
          "block";


        return;

      }



      error.style.display =
        "none";



      /*
      HACER EL CÁLCULO
      */


      const totalUSD =

        precio + fees;



      const totalARS =

        totalUSD * dolar;



      /*
      MOSTRAR RESULTADO
      */


      resultado.innerHTML =

        "$ " +

        totalARS.toLocaleString(

          "es-AR",

          {

            minimumFractionDigits: 0,

            maximumFractionDigits: 0

          }

        );



      resultado.style.display =
        "block";


    }


  </script>


</body>

</html>
