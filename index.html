<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Pocamarket Cotizador</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Yeseva+One&display=swap"
    rel="stylesheet"
  >

  <style>

    * {
      box-sizing: border-box;
    }

    html {
      width: 100%;
      min-height: 100%;
    }

    body {
      margin: 0;
      min-height: 100vh;

      background-image: url("./fondo.png");
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;

      font-family: Arial, sans-serif;

      overflow-x: hidden;
    }

    /* =========================
       CONTENEDOR GENERAL
    ========================= */

    .pagina {
      min-height: 100vh;

      display: flex;
      flex-direction: column;
      align-items: center;

      padding: 25px 15px 50px;
    }

    /* =========================
       DECORACIÓN SUPERIOR
    ========================= */

    .decoracion {
      width: min(850px, 95vw);

      position: relative;

      z-index: 2;

      margin-bottom: -25px;
    }

    .decoracion img {
      display: block;

      width: 100%;
      height: auto;
    }

    /* =========================
       ZONA DEL PLATO
    ========================= */

    .zona-cotizador {
      width: min(800px, 95vw);

      position: relative;

      display: flex;
      justify-content: center;
      align-items: center;
    }

    .plato {
      display: block;

      width: 100%;
      height: auto;

      pointer-events: none;
    }

    /* =========================
       COTIZADOR
    ========================= */

    .cotizador {
      position: absolute;

      top: 50%;
      left: 50%;

      transform: translate(-50%, -50%);

      width: 55%;

      text-align: center;
    }

    /* =========================
       INPUT
    ========================= */

    .campo-precio {
      position: relative;

      width: 100%;
    }

    #precioUSD {
      width: 100%;

      padding: 18px 60px 18px 20px;

      border: 2px solid #9b2924;

      border-radius: 18px;

      background: rgba(255, 255, 255, 0.55);

      color: #6d2a25;

      font-family: "Yeseva One", serif;

      font-size: 23px;

      outline: none;
    }

    #precioUSD::placeholder {
      color: #777;
    }

    #precioUSD:focus {
      border-color: #7d1f1b;

      box-shadow: 0 0 0 4px rgba(155, 41, 36, 0.15);
    }

    .dolar {
      position: absolute;

      right: 20px;
      top: 50%;

      transform: translateY(-50%);

      color: #92251f;

      font-family: "Yeseva One", serif;

      font-size: 32px;

      pointer-events: none;
    }

    /* =========================
       BOTÓN
    ========================= */

    button {
      width: 100%;

      margin-top: 18px;

      padding: 18px;

      border: none;

      border-radius: 18px;

      background: #4f7d13;

      color: white;

      font-family: "Yeseva One", serif;

      font-size: 23px;

      cursor: pointer;

      box-shadow: 0 5px 0 #35580c;

      transition: 0.2s;
    }

    button:hover {
      transform: translateY(-2px);
    }

    button:active {
      transform: translateY(3px);

      box-shadow: 0 2px 0 #35580c;
    }

    /* =========================
       SEPARADOR
    ========================= */

    .separador {
      border-top: 2px dotted #a22c26;

      margin: 28px 0 22px;
    }

    /* =========================
       RESULTADO
    ========================= */

    #resultado {
      display: none;

      width: 100%;

      padding: 25px 10px;

      border: 2px dashed #a22c26;

      border-radius: 20px;

      background: rgba(255, 255, 255, 0.20);

      color: #92251f;

      font-family: "Yeseva One", serif;

      font-size: 42px;

      text-align: center;
    }

    /* =========================
       ERROR
    ========================= */

    #error {
      display: none;

      margin-top: 15px;

      color: #9b2924;

      font-weight: bold;

      font-size: 14px;

      text-align: center;
    }

    /* =========================
       AVISO DEBAJO DE LA COTIZACIÓN
    ========================= */

    #aviso {
      display: none;

      width: min(760px, 92vw);

      margin-top: 30px;

      padding: 30px 35px;

      text-align: center;

      background: #f7efd9;

      border: 5px solid #8e211d;

      border-radius: 25px;

      color: #8e211d;

      font-family: "Yeseva One", serif;

      font-size: 27px;

      line-height: 1.65;

      box-shadow:
        0 8px 0 #4f7d13,
        0 12px 22px rgba(0, 0, 0, 0.25);
    }

    /* =========================
       VERSIÓN CELULAR
    ========================= */

    @media (max-width: 600px) {

      body {
        background-attachment: scroll;
      }

      .pagina {
        padding-top: 18px;
      }

      .decoracion {
        width: 100vw;

        margin-bottom: -15px;
      }

      .zona-cotizador {
        width: 120vw;
      }

      .cotizador {
        width: 48%;
      }

      #precioUSD {
        padding: 13px 40px 13px 12px;

        border-radius: 13px;

        font-size: 15px;
      }

      .dolar {
        right: 12px;

        font-size: 22px;
      }

      button {
        margin-top: 12px;

        padding: 13px;

        border-radius: 13px;

        font-size: 16px;
      }

      .separador {
        margin: 18px 0 14px;
      }

      #resultado {
        padding: 16px 5px;

        border-radius: 15px;

        font-size: 27px;
      }

      #error {
        font-size: 11px;
      }

      /* AVISO EN CELULAR */

      #aviso {
        width: 92vw;

        margin-top: 20px;

        padding: 24px 22px;

        border: 4px solid #8e211d;

        border-radius: 20px;

        font-size: 20px;

        line-height: 1.6;

        box-shadow:
          0 6px 0 #4f7d13,
          0 8px 15px rgba(0, 0, 0, 0.20);
      }

    }

  </style>

</head>

<body>

  <main class="pagina">

    <!-- DECORACIÓN SUPERIOR -->

    <div class="decoracion">

      <img
        src="./decoracion.png"
        alt="Pocamarket"
      >

    </div>


    <!-- PLATO Y COTIZADOR -->

    <div class="zona-cotizador">

      <img
        class="plato"
        src="./plato.png"
        alt=""
      >

      <div class="cotizador">

        <!-- CAMPO DE PRECIO -->

        <div class="campo-precio">

          <input
            type="number"
            id="precioUSD"
            placeholder="Precio en USD"
            min="0"
            step="0.01"
          >

          <span class="dolar">$</span>

        </div>


        <!-- BOTÓN -->

        <button
          type="button"
          onclick="cotizar()"
        >
          COTIZAR
        </button>


        <!-- SEPARADOR -->

        <div class="separador"></div>


        <!-- RESULTADO -->

        <div id="resultado"></div>


        <!-- ERROR -->

        <div id="error">
          Ingresá un precio válido.
        </div>

      </div>

    </div>


    <!-- AVISO QUE APARECE DESPUÉS DE COTIZAR -->

    <div id="aviso">

      La cotización ya incluye envío a casilla coreana.

      <br><br>

      Faltan agregar el envío e impuestos argentinos.

    </div>

  </main>


  <script>

    function cotizar() {

      const precio = parseFloat(
        document.getElementById("precioUSD").value
      );

      const resultado =
        document.getElementById("resultado");

      const error =
        document.getElementById("error");

      const aviso =
        document.getElementById("aviso");


      if (isNaN(precio) || precio <= 0) {

        resultado.style.display = "none";

        aviso.style.display = "none";

        error.style.display = "block";

        return;

      }


      error.style.display = "none";


      /* COTIZACIÓN SIN FEES - DÓLAR A $1600 */

      const totalARS = precio * 1600;


      resultado.innerHTML =
        "$ " +
        totalARS.toLocaleString(
          "es-AR",
          {
            maximumFractionDigits: 0
          }
        );


      resultado.style.display = "block";

      aviso.style.display = "block";

    }


    /* PERMITE COTIZAR CON ENTER */

    document
      .getElementById("precioUSD")
      .addEventListener(
        "keydown",
        function(event) {

          if (event.key === "Enter") {

            cotizar();

          }

        }
      );

  </script>

</body>

</html>
