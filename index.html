<!DOCTYPE html>
<html lang="es">
<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Samahani Cotizador</title>


  <!-- TIPOGRAFÍA YESEVA ONE -->

  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  >

  <link
    href="https://fonts.googleapis.com/css2?family=Yeseva+One&display=swap"
    rel="stylesheet"
  >


  <style>

    /* =========================
       CONFIGURACIÓN GENERAL
    ========================= */

    * {
      box-sizing: border-box;
    }


    body {

      margin: 0;

      min-height: 100vh;

      display: flex;
      flex-direction: column;
      align-items: center;

      padding: 25px 15px 180px;

      font-family: "Yeseva One", serif;


      /* IMAGEN DE FONDO */

      background-image: url("fondo.png");

      background-size: cover;

      background-position: center top;

      background-repeat: no-repeat;

      background-attachment: fixed;

    }


    /* =========================
       DECORACIÓN SUPERIOR
    ========================= */

    .decoracion {

      width: 100%;

      max-width: 850px;

      display: flex;

      justify-content: center;

      margin-bottom: 20px;

    }


    .decoracion img {

      width: 100%;

      max-width: 700px;

      height: auto;

      display: block;

    }


    /* =========================
       CONTENEDOR DE LA MANZANA
    ========================= */

    .apple-container {

      position: relative;

      width: 100%;

      max-width: 650px;

      margin-top: 80px;

    }


    /* =========================
       TALLO
    ========================= */

    .apple-container::before {

      content: "";

      position: absolute;

      width: 42px;

      height: 115px;

      top: -85px;

      left: 50%;

      transform:
        translateX(-50%)
        rotate(-20deg);

      border-radius: 25px;

      background:

        linear-gradient(
          90deg,
          #4d200d,
          #8c461c,
          #4d200d
        );

      z-index: 5;

    }


    /* =========================
       HOJA VERDE
    ========================= */

    .apple-container::after {

      content: "";

      position: absolute;

      width: 150px;

      height: 85px;

      top: -70px;

      left: 50%;

      transform: rotate(-28deg);

      border-radius:
        100% 0
        100% 0;

      background:

        linear-gradient(
          135deg,
          #82b82e,
          #376f0e
        );

      z-index: 4;

    }


    /* =========================
       MANZANA ROJA
    ========================= */

    .apple {

      position: relative;

      width: 100%;

      padding: 38px;

      background:

        radial-gradient(
          circle at 28% 20%,
          #ff6767,
          #e32323 32%,
          #b20f0f 75%
        );

      border:

        8px solid #b81717;


      border-radius:

        45% 45% 43% 43%

        /

        32% 32% 58% 58%;


      box-shadow:

        inset
        12px
        12px
        25px
        rgba(255,255,255,0.18),

        inset
        -15px
        -15px
        30px
        rgba(80,0,0,0.35),

        0
        20px
        35px
        rgba(0,0,0,0.25);

    }


    /* =========================
       BRILLO DE LA MANZANA
    ========================= */

    .apple::before {

      content: "";

      position: absolute;

      width: 120px;

      height: 300px;

      top: 100px;

      left: 40px;

      border-radius: 50%;

      background:

        linear-gradient(
          90deg,
          rgba(255,255,255,0.25),
          transparent
        );

      transform: rotate(15deg);

      pointer-events: none;

    }


    /* =========================
       INTERIOR CREMA
    ========================= */

    .apple-inner {

      position: relative;

      z-index: 2;

      min-height: 520px;

      padding:

        70px
        45px
        50px;


      background:

        linear-gradient(
          135deg,
          #fffdf4,
          #f7f0dc
        );


      border-radius:

        38% 38% 40% 40%

        /

        28% 28% 52% 52%;


      box-shadow:

        inset
        0
        0
        30px
        rgba(120,90,30,0.08);


      display: flex;

      flex-direction: column;

      justify-content: center;

    }


    /* =========================
       INPUT
    ========================= */

    .input-usd {

      width: 100%;

      padding: 20px;

      border:

        3px
        solid
        #9e2922;

      border-radius: 20px;

      background:

        rgba(
          255,
          255,
          255,
          0.9
        );


      font-family:
        "Yeseva One",
        serif;

      font-size: 24px;

      text-align: center;

      color: #4a332c;

      outline: none;

    }


    .input-usd::placeholder {

      color: #999;

    }


    .input-usd:focus {

      border-color: #4d7d13;

      box-shadow:

        0
        0
        0
        5px

        rgba(
          77,
          125,
          19,
          0.15
        );

    }


    /* =========================
       BOTÓN VERDE
    ========================= */

    button {

      width: 100%;

      margin-top: 28px;

      padding: 20px;

      border: none;

      border-radius: 20px;


      background:

        linear-gradient(
          135deg,
          #659d1d,
          #3e7010
        );


      color: white;

      font-family:
        "Yeseva One",
        serif;

      font-size: 25px;

      cursor: pointer;


      box-shadow:

        0
        7px
        0
        #31570c,

        0
        12px
        20px
        rgba(0,0,0,0.15);


      transition: 0.2s;

    }


    button:hover {

      transform:
        translateY(-2px);

    }


    button:active {

      transform:
        translateY(4px);

      box-shadow:

        0
        3px
        0
        #31570c;

    }


    /* =========================
       RESULTADO
    ========================= */

    .resultado {

      margin-top: 38px;

      padding: 35px 20px;

      border:

        2px
        dashed
        #8d1e1e;

      border-radius: 25px;


      background:

        rgba(
          255,
          255,
          255,
          0.35
        );


      color:
        #941d1d;

      font-size: 42px;

      text-align: center;

      display: none;

      word-break: break-word;

    }


    /* =========================
       AVISO INFORMATIVO
    ========================= */

    .aviso {

      margin-top: 20px;

      padding: 16px;

      color: #8d1e1e;

      font-family:
        Arial,
        sans-serif;

      font-size: 14px;

      font-weight: bold;

      line-height: 1.5;

      text-align: center;


      background:

        rgba(
          255,
          255,
          255,
          0.45
        );


      border-radius: 18px;


      display: none;

    }


    /* =========================
       MENSAJE DE ERROR
    ========================= */

    .error {

      margin-top: 20px;

      text-align: center;

      color: #8d1e1e;

      font-family:
        Arial,
        sans-serif;

      font-weight: bold;

      font-size: 16px;

      display: none;

    }


    /* =========================
       VERSIÓN PARA CELULAR
    ========================= */

    @media (max-width: 600px) {


      body {

        padding:

          15px
          10px
          160px;

      }


      .decoracion img {

        max-width: 100%;

      }


      .apple-container {

        margin-top: 60px;

      }


      .apple {

        padding: 20px;

        border-width: 6px;

      }


      .apple-inner {

        min-height: 470px;

        padding:

          60px
          25px
          40px;

      }


      .apple-container::before {

        width: 32px;

        height: 90px;

        top: -68px;

      }


      .apple-container::after {

        width: 110px;

        height: 60px;

        top: -55px;

      }


      .input-usd {

        font-size: 19px;

        padding: 17px;

      }


      button {

        font-size: 20px;

        padding: 17px;

      }


      .resultado {

        font-size: 32px;

        padding: 25px 15px;

      }


      .aviso {

        font-size: 12px;

        padding: 14px;

      }

    }

  </style>

</head>


<body>


  <!-- =========================
       IMAGEN DECORATIVA
    ========================= -->

  <div class="decoracion">

    <img
      src="decoracion.png"
      alt="Samahani Cotizador"
    >

  </div>



  <!-- =========================
       CONTENEDOR MANZANA
    ========================= -->

  <div class="apple-container">


    <!-- CUERPO DE LA MANZANA -->

    <div class="apple">


      <!-- INTERIOR CREMA -->

      <div class="apple-inner">


        <!-- INGRESAR PRECIO -->

        <input

          type="number"

          id="precioUSD"

          class="input-usd"

          placeholder="Precio en USD"

          min="0"

          step="0.01"

        >



        <!-- BOTÓN -->

        <button
          onclick="cotizar()"
        >

          COTIZAR

        </button>



        <!-- RESULTADO -->

        <div
          id="resultado"
          class="resultado"
        ></div>



        <!-- AVISO
             APARECE SOLO DESPUÉS
             DE COTIZAR -->

        <div
          id="aviso"
          class="aviso"
        >

          Los precios que se muestran solo incluyen fees.
          El envío a casilla japonesa se cobra por aparte,
          ya que depende del peso y la cantidad de items
          que entren en el envío.

        </div>



        <!-- ERROR -->

        <div
          id="error"
          class="error"
        >

          Ingresá un precio válido.

        </div>


      </div>

    </div>

  </div>



  <script>


    function cotizar() {


      /* =====================
         OBTENER PRECIO
      ===================== */

      const precio = parseFloat(

        document
          .getElementById("precioUSD")
          .value

      );


      /* =====================
         CONFIGURACIÓN

         CAMBIÁ ESTOS VALORES
         CUANDO LO NECESITES
      ===================== */

      const fees = 3.50;

      const dolar = 1530;


      /* =====================
         ELEMENTOS
      ===================== */

      const resultado =

        document
          .getElementById("resultado");


      const aviso =

        document
          .getElementById("aviso");


      const error =

        document
          .getElementById("error");


      /* =====================
         VALIDAR PRECIO
      ===================== */

      if (

        isNaN(precio)

        ||

        precio <= 0

      ) {


        resultado.style.display =
          "none";


        aviso.style.display =
          "none";


        error.style.display =
          "block";


        return;

      }


      /* OCULTAR ERROR */

      error.style.display =
        "none";


      /* =====================
         HACER CÁLCULO
      ===================== */

      const totalUSD =

        precio + fees;


      const totalARS =

        totalUSD * dolar;


      /* =====================
         MOSTRAR RESULTADO
      ===================== */

      resultado.innerHTML =

        "$ " +

        totalARS.toLocaleString(

          "es-AR",

          {

            minimumFractionDigits: 0,

            maximumFractionDigits: 0

          }

        );


      resultado.style.display =
        "block";


      /* =====================
         MOSTRAR AVISO
         SOLO DESPUÉS
         DE COTIZAR
      ===================== */

      aviso.style.display =
        "block";


    }


  </script>

</body>

</html>
