<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Samahani Cotizador</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Yeseva+One&display=swap" rel="stylesheet">

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;

      display: flex;
      flex-direction: column;
      align-items: center;

      padding: 25px 15px 180px;

      font-family: "Yeseva One", serif;

      background-image: url("fondo.png");
      background-size: cover;
      background-position: center top;
      background-repeat: no-repeat;
      background-attachment: fixed;
    }


    /* =========================
       DECORACION SUPERIOR
    ========================= */

    .decoracion {
      width: 100%;
      max-width: 900px;
      margin-bottom: 20px;
    }

    .decoracion img {
      width: 100%;
      display: block;
    }


    /* =========================
       CONTENEDOR PRINCIPAL
    ========================= */

    .apple-wrapper {
      position: relative;

      width: min(90vw, 780px);

      margin-top: 45px;
      padding-top: 100px;
    }


    /* =========================
       TALLO
    ========================= */

    .tallo {
      position: absolute;

      width: 45px;
      height: 150px;

      top: 0;
      left: 50%;

      transform: translateX(-50%) rotate(-20deg);

      background:
        linear-gradient(
          90deg,
          #4b1d08,
          #8b431a,
          #5b260c
        );

      border-radius: 30px;

      z-index: 10;

      box-shadow:
        inset 5px 0 8px rgba(255,255,255,0.15),
        4px 4px 8px rgba(0,0,0,0.2);
    }


    /* =========================
       HOJA
    ========================= */

    .hoja {
      position: absolute;

      width: 190px;
      height: 110px;

      top: 15px;
      left: 50%;

      background:
        linear-gradient(
          135deg,
          #9dca45,
          #4c8d0e,
          #245b08
        );

      border-radius:
        100% 0
        100% 0;

      transform:
        translateX(-5%)
        rotate(-32deg);

      z-index: 9;

      box-shadow:
        inset 8px 8px 15px rgba(255,255,255,0.18),
        4px 6px 10px rgba(0,0,0,0.15);
    }

    .hoja::after {
      content: "";

      position: absolute;

      width: 3px;
      height: 125px;

      background: rgba(45,100,10,0.7);

      left: 48%;
      top: -5px;

      transform: rotate(45deg);

      border-radius: 20px;
    }


    /* =========================
       MANZANA ROJA
    ========================= */

    .apple {
      position: relative;

      width: 100%;

      padding: 115px 70px 80px;

      background:
        radial-gradient(
          circle at 28% 20%,
          #ff7770 0%,
          #f13a32 22%,
          #dc1f1a 50%,
          #bd100d 78%,
          #97100d 100%
        );

      border: 10px solid #bc1612;

      /*
       FORMA DE MANZANA
      */

      border-radius:
        38% 38% 45% 45%
        /
        22% 22% 48% 48%;

      min-height: 850px;

      box-shadow:
        inset 15px 15px 30px rgba(255,255,255,0.20),
        inset -18px -20px 35px rgba(90,0,0,0.28),
        0 18px 30px rgba(0,0,0,0.22);

      overflow: visible;
    }


    /* =========================
       LOBULO SUPERIOR IZQUIERDO
    ========================= */

    .apple::before {
      content: "";

      position: absolute;

      width: 58%;
      height: 220px;

      top: -65px;
      left: -2%;

      background:
        radial-gradient(
          circle at 30% 30%,
          #ff746d,
          #df211b 60%,
          #bd100d
        );

      border-radius: 50%;

      z-index: -1;

      border-top: 10px solid #bc1612;

      border-left: 10px solid #bc1612;
    }


    /* =========================
       LOBULO SUPERIOR DERECHO
    ========================= */

    .apple::after {
      content: "";

      position: absolute;

      width: 58%;
      height: 220px;

      top: -65px;
      right: -2%;

      background:
        radial-gradient(
          circle at 65% 30%,
          #f5524c,
          #d81914 60%,
          #a90d0a
        );

      border-radius: 50%;

      z-index: -1;

      border-top: 10px solid #bc1612;

      border-right: 10px solid #bc1612;
    }


    /* =========================
       BRILLO
    ========================= */

    .brillo {
      position: absolute;

      width: 100px;
      height: 320px;

      top: 150px;
      left: 55px;

      border-radius: 50%;

      background:
        linear-gradient(
          90deg,
          rgba(255,255,255,0.30),
          rgba(255,255,255,0)
        );

      transform: rotate(15deg);

      pointer-events: none;
    }


    /* =========================
       INTERIOR CREMA
    ========================= */

    .apple-inner {
      position: relative;

      width: 100%;

      min-height: 610px;

      padding: 65px 55px 55px;

      background:
        radial-gradient(
          circle at 50% 20%,
          #fffdf7,
          #fff9ec 50%,
          #f5ebd7 100%
        );

      border-radius:
        32% 32% 40% 40%
        /
        20% 20% 45% 45%;

      z-index: 3;

      box-shadow:
        inset 0 0 35px rgba(120,80,30,0.10);

      display: flex;
      flex-direction: column;
      justify-content: center;
    }


    /* =========================
       INPUT
    ========================= */

    .input-container {
      position: relative;
    }

    .input-usd {
      width: 100%;

      padding: 26px 65px 26px 25px;

      border: 3px solid #97251f;

      border-radius: 24px;

      background: rgba(255,255,255,0.75);

      color: #555;

      font-family: "Yeseva One", serif;

      font-size: 30px;

      outline: none;
    }

    .input-usd::placeholder {
      color: #8d8d8d;
    }

    .input-usd:focus {
      border-color: #4e810d;

      box-shadow:
        0 0 0 5px rgba(78,129,13,0.12);
    }


    /* SIGNO $ */

    .simbolo {
      position: absolute;

      right: 25px;
      top: 50%;

      transform: translateY(-50%);

      color: #9c211d;

      font-size: 48px;
    }


    /* =========================
       BOTON
    ========================= */

    button {
      width: 100%;

      margin-top: 30px;

      padding: 27px;

      border: none;

      border-radius: 25px;

      background:
        linear-gradient(
          135deg,
          #6fa722,
          #4b810d
        );

      color: white;

      font-family: "Yeseva One", serif;

      font-size: 38px;

      cursor: pointer;

      box-shadow:
        inset 5px 5px 12px rgba(255,255,255,0.12),
        0 8px 0 #35620a,
        0 15px 20px rgba(0,0,0,0.12);

      transition: 0.2s;
    }

    button:hover {
      transform: translateY(-2px);
    }

    button:active {
      transform: translateY(5px);

      box-shadow:
        0 3px 0 #35620a;
    }


    /* =========================
       LINEA DECORATIVA
    ========================= */

    .linea {
      width: 100%;

      margin: 45px 0 35px;

      border-top: 2px dotted #a52b26;

      position: relative;
    }


    /* =========================
       RESULTADO
    ========================= */

    .resultado {
      display: none;

      padding: 40px 20px;

      min-height: 190px;

      border: 2px dashed #a52822;

      border-radius: 28px;

      background:
        rgba(255,255,255,0.20);

      color: #9c211d;

      font-size: 65px;

      text-align: center;

      word-break: break-word;

      align-content: center;
    }


    /* =========================
       AVISO
    ========================= */

    .aviso {
      display: none;

      margin-top: 25px;

      padding: 18px;

      color: #8f211d;

      font-family: Arial, sans-serif;

      font-size: 15px;

      font-weight: bold;

      line-height: 1.6;

      text-align: center;
    }


    /* =========================
       ERROR
    ========================= */

    .error {
      display: none;

      margin-top: 25px;

      color: #8f211d;

      font-family: Arial, sans-serif;

      font-size: 18px;

      font-weight: bold;

      text-align: center;
    }


    /* =========================
       CELULAR
    ========================= */

    @media (max-width: 600px) {

      body {
        padding: 15px 8px 150px;
      }

      .apple-wrapper {
        width: 96vw;
        margin-top: 30px;
        padding-top: 80px;
      }

      .apple {
        min-height: 670px;

        padding: 90px 25px 45px;

        border-width: 7px;
      }

      .apple::before,
      .apple::after {
        height: 160px;
        top: -45px;
      }

      .tallo {
        width: 30px;
        height: 110px;
      }

      .hoja {
        width: 140px;
        height: 80px;
      }

      .apple-inner {
        min-height: 480px;

        padding: 45px 25px 40px;
      }

      .input-usd {
        padding: 20px 55px 20px 18px;

        font-size: 22px;
      }

      .simbolo {
        font-size: 35px;
        right: 18px;
      }

      button {
        padding: 21px;

        font-size: 27px;
      }

      .resultado {
        min-height: 150px;

        font-size: 48px;
      }

      .aviso {
        font-size: 13px;
      }

    }

  </style>
</head>


<body>


  <!-- DECORACION SUPERIOR -->

  <div class="decoracion">

    <img
      src="decoracion.png"
      alt="Samahani Cotizador"
    >

  </div>


  <!-- MANZANA -->

  <div class="apple-wrapper">

    <div class="tallo"></div>

    <div class="hoja"></div>


    <div class="apple">

      <div class="brillo"></div>


      <div class="apple-inner">


        <!-- PRECIO -->

        <div class="input-container">

          <input
            type="number"
            id="precioUSD"
            class="input-usd"
            placeholder="Precio en USD"
            min="0"
            step="0.01"
          >

          <span class="simbolo">$</span>

        </div>


        <!-- BOTON -->

        <button onclick="cotizar()">
          COTIZAR
        </button>


        <!-- LINEA -->

        <div class="linea"></div>


        <!-- RESULTADO -->

        <div
          id="resultado"
          class="resultado"
        ></div>


        <!-- AVISO -->

        <div
          id="aviso"
          class="aviso"
        >

          Los precios que se muestran solo incluyen fees.
          El envío a casilla japonesa se cobra por aparte,
          ya que depende del peso y la cantidad de items
          que entren en el envío.

        </div>


        <!-- ERROR -->

        <div
          id="error"
          class="error"
        >
          Ingresá un precio válido.
        </div>


      </div>

    </div>

  </div>


  <script>

    function cotizar() {

      const precio = parseFloat(
        document.getElementById("precioUSD").value
      );

      const fees = 3.50;

      const dolar = 1530;


      const resultado =
        document.getElementById("resultado");

      const aviso =
        document.getElementById("aviso");

      const error =
        document.getElementById("error");


      if (isNaN(precio) || precio <= 0) {

        resultado.style.display = "none";

        aviso.style.display = "none";

        error.style.display = "block";

        return;

      }


      error.style.display = "none";


      const totalUSD =
        precio + fees;


      const totalARS =
        totalUSD * dolar;


      resultado.innerHTML =
        "$ " +
        totalARS.toLocaleString(
          "es-AR",
          {
            minimumFractionDigits: 0,
            maximumFractionDigits: 0
          }
        );


      resultado.style.display = "block";

      aviso.style.display = "block";

    }

  </script>

</body>
</html>
