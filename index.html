<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Samahani Cotizador</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Yeseva+One&display=swap"
    rel="stylesheet"
  >

  <style>

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      padding: 20px 15px 150px;

      display: flex;
      flex-direction: column;
      align-items: center;

      font-family: "Yeseva One", serif;

      background-image: url("fondo.png");
      background-size: cover;
      background-position: center top;
      background-repeat: no-repeat;
      background-attachment: fixed;
    }


    /* DECORACIÓN SUPERIOR */

    .decoracion {
      width: 100%;
      max-width: 850px;
      margin-bottom: 10px;
    }

    .decoracion img {
      display: block;
      width: 100%;
      height: auto;
    }


    /* CONTENEDOR GENERAL */

    .apple-container {
      position: relative;

      width: min(94vw, 760px);
      aspect-ratio: 0.82;

      margin-top: 30px;

      display: flex;
      justify-content: center;
      align-items: center;
    }


    /* SVG DE LA MANZANA */

    .apple-svg {
      position: absolute;

      width: 100%;
      height: 100%;

      inset: 0;

      z-index: 1;

      overflow: visible;

      pointer-events: none;
    }


    /* CONTENEDOR DEL COTIZADOR */

    .cotizador {
      position: relative;
      z-index: 2;

      width: 68%;

      margin-top: 7%;

      padding: 70px 45px 55px;

      background: #fff9e9;

      border-radius: 45px;

      box-shadow:
        inset 0 0 25px rgba(120, 80, 30, 0.08),
        0 10px 25px rgba(0, 0, 0, 0.10);
    }


    /* INPUT */

    .input-container {
      position: relative;
      width: 100%;
    }

    .input-usd {
      width: 100%;

      padding: 22px 65px 22px 22px;

      border: 3px solid #9b2722;
      border-radius: 22px;

      background: white;

      color: #555;

      font-family: "Yeseva One", serif;
      font-size: 25px;

      outline: none;
    }

    .input-usd::placeholder {
      color: #999;
    }

    .input-usd:focus {
      border-color: #568a19;

      box-shadow:
        0 0 0 5px
        rgba(86, 138, 25, 0.12);
    }


    /* SIGNO $ */

    .simbolo {
      position: absolute;

      right: 22px;
      top: 50%;

      transform: translateY(-50%);

      color: #9b2722;

      font-size: 38px;
    }


    /* BOTÓN */

    button {
      width: 100%;

      margin-top: 25px;
      padding: 22px;

      border: none;
      border-radius: 22px;

      background: #568a19;

      color: white;

      font-family: "Yeseva One", serif;
      font-size: 29px;

      cursor: pointer;

      box-shadow:
        0 7px 0 #3d6810;

      transition: 0.2s;
    }

    button:hover {
      transform: translateY(-2px);
    }

    button:active {
      transform: translateY(4px);

      box-shadow:
        0 3px 0 #3d6810;
    }


    /* SEPARADOR */

    .separador {
      width: 100%;

      margin: 38px 0 30px;

      border-top: 2px dotted #a52822;
    }


    /* RESULTADO */

    .resultado {
      display: none;

      width: 100%;
      min-height: 145px;

      padding: 25px 15px;

      border: 2px dashed #a52822;
      border-radius: 24px;

      background: rgba(255,255,255,0.35);

      color: #8f1e1b;

      font-size: 45px;

      text-align: center;
      align-content: center;
    }


    /* AVISO */

    .aviso {
      display: none;

      margin-top: 18px;

      color: #8d211d;

      font-family: Arial, sans-serif;

      font-size: 13px;
      font-weight: bold;

      line-height: 1.5;

      text-align: center;
    }


    /* ERROR */

    .error {
      display: none;

      margin-top: 18px;

      color: #941f1b;

      font-family: Arial, sans-serif;

      font-size: 15px;
      font-weight: bold;

      text-align: center;
    }


    /* CELULAR */

    @media (max-width: 600px) {

      body {
        padding: 12px 6px 120px;
      }

      .apple-container {
        width: 98vw;
        margin-top: 10px;
      }

      .cotizador {
        width: 67%;

        padding: 50px 20px 38px;

        border-radius: 32px;
      }

      .input-usd {
        padding: 18px 48px 18px 15px;

        font-size: 18px;
      }

      .simbolo {
        right: 15px;

        font-size: 30px;
      }

      button {
        padding: 18px;

        font-size: 23px;
      }

      .resultado {
        min-height: 120px;

        font-size: 34px;
      }

      .aviso {
        font-size: 11px;
      }

    }

  </style>
</head>

<body>


  <!-- DECORACIÓN -->

  <div class="decoracion">

    <img
      src="decoracion.png"
      alt="Samahani Cotizador"
    >

  </div>


  <!-- MANZANA -->

  <div class="apple-container">


    <!-- SILUETA SVG -->

    <svg
      class="apple-svg"
      viewBox="0 0 800 950"
      xmlns="http://www.w3.org/2000/svg"
    >

      <defs>

        <linearGradient
          id="appleRed"
          x1="0"
          y1="0"
          x2="1"
          y2="1"
        >

          <stop
            offset="0%"
            stop-color="#f24b43"
          />

          <stop
            offset="45%"
            stop-color="#d91f1a"
          />

          <stop
            offset="100%"
            stop-color="#a80f0c"
          />

        </linearGradient>


        <linearGradient
          id="leafGreen"
          x1="0"
          y1="0"
          x2="1"
          y2="1"
        >

          <stop
            offset="0%"
            stop-color="#91bd35"
          />

          <stop
            offset="100%"
            stop-color="#477d13"
          />

        </linearGradient>

      </defs>


      <!-- CUERPO DE LA MANZANA -->

      <path

        d="

          M 400 180

          C 330 100,
            190 105,
            115 205

          C 55 285,
            55 450,
            105 610

          C 145 745,
            240 860,
            350 885

          C 370 890,
            390 882,
            400 860

          C 410 882,
            430 890,
            450 885

          C 560 860,
            655 745,
            695 610

          C 745 450,
            745 285,
            685 205

          C 610 105,
            470 100,
            400 180

          Z

        "

        fill="url(#appleRed)"

        stroke="#991410"

        stroke-width="16"

      />


      <!-- SOMBRA INTERIOR -->

      <path

        d="

          M 400 190

          C 340 135,
            230 135,
            165 220

          C 105 300,
            115 460,
            150 590

          C 185 715,
            275 820,
            360 845

        "

        fill="none"

        stroke="rgba(255,255,255,0.16)"

        stroke-width="28"

        stroke-linecap="round"

      />


      <!-- HENDIDURA SUPERIOR -->

      <path

        d="

          M 400 180

          C 370 130,
            340 118,
            305 135

          C 350 105,
            380 110,
            400 145

          C 420 110,
            450 105,
            495 135

          C 460 118,
            430 130,
            400 180

        "

        fill="#a9110e"

      />


      <!-- TALLO -->

      <path

        d="

          M 400 155

          C 390 105,
            410 65,
            445 30

        "

        fill="none"

        stroke="#693311"

        stroke-width="26"

        stroke-linecap="round"

      />


      <!-- HOJA -->

      <path

        d="

          M 425 75

          C 500 5,
            630 25,
            650 105

          C 560 130,
            485 115,
            425 75

          Z

        "

        fill="url(#leafGreen)"

        stroke="#467514"

        stroke-width="8"

      />


      <!-- NERVADURA HOJA -->

      <path

        d="

          M 435 78

          C 500 70,
            560 70,
            625 100

        "

        fill="none"

        stroke="#3f7211"

        stroke-width="6"

        stroke-linecap="round"

      />


      <!-- HENDIDURA INFERIOR -->

      <path

        d="

          M 350 885

          C 375 850,
            390 845,
            400 860

          C 410 845,
            425 850,
            450 885

          C 430 905,
            370 905,
            350 885

          Z

        "

        fill="#97100d"

      />

    </svg>


    <!-- COTIZADOR -->

    <div class="cotizador">

      <div class="input-container">

        <input
          type="number"
          id="precioUSD"
          class="input-usd"
          placeholder="Precio en USD"
          min="0"
          step="0.01"
        >

        <span class="simbolo">$</span>

      </div>


      <button
        type="button"
        onclick="cotizar()"
      >
        COTIZAR
      </button>


      <div class="separador"></div>


      <div
        id="resultado"
        class="resultado"
      ></div>


      <div
        id="aviso"
        class="aviso"
      >

        Los precios que se muestran solo incluyen fees.
        El envío a casilla japonesa se cobra por aparte,
        ya que depende del peso y la cantidad de items
        que entren en el envío.

      </div>


      <div
        id="error"
        class="error"
      >
        Ingresá un precio válido.
      </div>

    </div>

  </div>


  <script>

    function cotizar() {

      const precio = parseFloat(
        document.getElementById("precioUSD").value
      );

      const fees = 3.50;
      const dolar = 1530;

      const resultado =
        document.getElementById("resultado");

      const aviso =
        document.getElementById("aviso");

      const error =
        document.getElementById("error");


      if (isNaN(precio) || precio <= 0) {

        resultado.style.display = "none";
        aviso.style.display = "none";
        error.style.display = "block";

        return;
      }


      error.style.display = "none";


      const totalUSD = precio + fees;
      const totalARS = totalUSD * dolar;


      resultado.innerHTML =
        "$ " +
        totalARS.toLocaleString(
          "es-AR",
          {
            minimumFractionDigits: 0,
            maximumFractionDigits: 0
          }
        );


      resultado.style.display = "block";
      aviso.style.display = "block";

    }


    document
      .getElementById("precioUSD")
      .addEventListener(
        "keydown",
        function(event) {

          if (event.key === "Enter") {
            cotizar();
          }

        }
      );

  </script>

</body>
</html>
