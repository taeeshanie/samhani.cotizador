<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Samahani Cotizador</title>


  <!-- TIPOGRAFÍA -->

  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  >

  <link
    href="https://fonts.googleapis.com/css2?family=Yeseva+One&display=swap"
    rel="stylesheet"
  >


  <style>

    /* =========================
       RESETEO GENERAL
    ========================= */

    * {
      box-sizing: border-box;
    }


    html {
      margin: 0;
      padding: 0;
    }


    body {

      margin: 0;
      min-height: 100vh;

      display: flex;
      flex-direction: column;
      align-items: center;

      padding: 25px 15px 180px;

      font-family:
        "Yeseva One",
        serif;


      /* FONDO */

      background-image:
        url("fondo.png");

      background-size: cover;

      background-position: center top;

      background-repeat: no-repeat;

      background-attachment: fixed;

    }


    /* =========================
       DECORACIÓN SUPERIOR
    ========================= */

    .decoracion {

      width: 100%;

      max-width: 900px;

      margin-bottom: 35px;

    }


    .decoracion img {

      width: 100%;

      height: auto;

      display: block;

    }


    /* =========================
       CONTENEDOR PRINCIPAL

       ESTE ES EL LUGAR DONDE
       VAMOS A CONSTRUIR DESPUÉS
       EL MARCO DE MANZANA
    ========================= */

    .cotizador-marco {

      position: relative;

      width: 100%;

      max-width: 620px;

      padding: 12px;

    }


    /* =========================
       PANEL INTERIOR

       POR AHORA ES SIMPLE.
       NO HAY MANZANA.
    ========================= */

    .cotizador {

      width: 100%;

      padding:

        55px
        45px
        50px;


      background:

        rgba(
          255,
          250,
          238,
          0.96
        );


      border:

        4px solid
        #a52520;


      border-radius:

        45px;


      box-shadow:

        0
        15px
        35px
        rgba(
          0,
          0,
          0,
          0.18
        );


      position: relative;

    }


    /* =========================
       INPUT
    ========================= */

    .input-container {

      position: relative;

      width: 100%;

    }


    .input-usd {

      width: 100%;

      padding:

        24px
        70px
        24px
        25px;


      border:

        3px solid
        #9b2722;


      border-radius:

        22px;


      background:

        rgba(
          255,
          255,
          255,
          0.92
        );


      color:
        #555;


      font-family:
        "Yeseva One",
        serif;


      font-size:
        28px;


      text-align:
        left;


      outline:
        none;

    }


    .input-usd::placeholder {

      color:
        #999;

    }


    .input-usd:focus {

      border-color:
        #4f8111;


      box-shadow:

        0
        0
        0
        5px

        rgba(
          79,
          129,
          17,
          0.12
        );

    }


    /* =========================
       SIGNO $
    ========================= */

    .simbolo {

      position:
        absolute;

      top:
        50%;

      right:
        25px;


      transform:
        translateY(-50%);


      color:
        #9b2722;


      font-size:
        45px;

    }


    /* =========================
       BOTÓN VERDE
    ========================= */

    button {

      width:
        100%;


      margin-top:
        28px;


      padding:
        25px;


      border:
        none;


      border-radius:
        22px;


      background:

        linear-gradient(
          135deg,
          #6c9f22,
          #46770e
        );


      color:
        white;


      font-family:
        "Yeseva One",
        serif;


      font-size:
        34px;


      cursor:
        pointer;


      box-shadow:

        inset
        4px
        4px
        10px
        rgba(
          255,
          255,
          255,
          0.12
        ),

        0
        7px
        0
        #315b09;


      transition:
        0.2s;

    }


    button:hover {

      transform:
        translateY(-2px);

    }


    button:active {

      transform:
        translateY(4px);


      box-shadow:

        0
        3px
        0
        #315b09;

    }


    /* =========================
       SEPARADOR
    ========================= */

    .separador {

      width:
        100%;


      margin:

        45px
        0
        35px;


      border-top:

        2px dotted
        #a52822;

    }


    /* =========================
       RESULTADO
    ========================= */

    .resultado {

      display:
        none;


      width:
        100%;


      min-height:
        170px;


      padding:
        30px
        20px;


      border:

        2px dashed
        #a52822;


      border-radius:
        25px;


      background:

        rgba(
          255,
          255,
          255,
          0.35
        );


      color:
        #941f1b;


      font-size:
        58px;


      text-align:
        center;


      align-content:
        center;


      word-break:
        break-word;

    }


    /* =========================
       AVISO
    ========================= */

    .aviso {

      display:
        none;


      margin-top:
        20px;


      color:
        #8d211d;


      font-family:
        Arial,
        sans-serif;


      font-size:
        14px;


      font-weight:
        bold;


      line-height:
        1.6;


      text-align:
        center;

    }


    /* =========================
       ERROR
    ========================= */

    .error {

      display:
        none;


      margin-top:
        20px;


      color:
        #941f1b;


      font-family:
        Arial,
        sans-serif;


      font-size:
        16px;


      font-weight:
        bold;


      text-align:
        center;

    }


    /* =========================
       VERSIÓN CELULAR
    ========================= */

    @media
    (max-width: 600px) {


      body {

        padding:

          15px
          10px
          150px;

      }


      .decoracion {

        margin-bottom:
          25px;

      }


      .cotizador {

        padding:

          40px
          22px
          35px;


        border-radius:
          35px;

      }


      .input-usd {

        padding:

          19px
          55px
          19px
          18px;


        font-size:
          21px;

      }


      .simbolo {

        right:
          18px;


        font-size:
          34px;

      }


      button {

        padding:
          20px;


        font-size:
          26px;

      }


      .resultado {

        min-height:
          140px;


        font-size:
          43px;

      }


      .aviso {

        font-size:
          12px;

      }

    }

  </style>

</head>


<body>


  <!-- =========================
       DECORACIÓN SUPERIOR
    ========================= -->

  <div class="decoracion">

    <img
      src="decoracion.png"
      alt="Samahani Cotizador"
    >

  </div>



  <!-- =========================
       MARCO PRINCIPAL

       DESDE AQUÍ VAMOS A ARMAR
       LA FORMA DE LA MANZANA
       EN EL SIGUIENTE PASO
    ========================= -->

  <div class="cotizador-marco">


    <div class="cotizador">


      <!-- INPUT -->

      <div class="input-container">

        <input

          type="number"

          id="precioUSD"

          class="input-usd"

          placeholder="Precio en USD"

          min="0"

          step="0.01"

        >


        <span class="simbolo">
          $
        </span>

      </div>



      <!-- BOTÓN -->

      <button
        type="button"
        onclick="cotizar()"
      >

        COTIZAR

      </button>



      <!-- SEPARADOR -->

      <div class="separador"></div>



      <!-- RESULTADO -->

      <div

        id="resultado"

        class="resultado"

      ></div>



      <!-- AVISO -->

      <div

        id="aviso"

        class="aviso"

      >

        Los precios que se muestran solo incluyen fees.
        El envío a casilla japonesa se cobra por aparte,
        ya que depende del peso y la cantidad de items
        que entren en el envío.

      </div>



      <!-- ERROR -->

      <div

        id="error"

        class="error"

      >

        Ingresá un precio válido.

      </div>


    </div>

  </div>



  <script>


    function cotizar() {


      const precio = parseFloat(

        document
          .getElementById("precioUSD")
          .value

      );


      /* VALORES DEL COTIZADOR */

      const fees = 3.50;

      const dolar = 1530;


      const resultado =

        document
          .getElementById("resultado");


      const aviso =

        document
          .getElementById("aviso");


      const error =

        document
          .getElementById("error");


      /* VALIDACIÓN */

      if (

        isNaN(precio)

        ||

        precio <= 0

      ) {


        resultado.style.display =
          "none";


        aviso.style.display =
          "none";


        error.style.display =
          "block";


        return;

      }


      /* OCULTAR ERROR */

      error.style.display =
        "none";


      /* CÁLCULO */

      const totalUSD =
        precio + fees;


      const totalARS =
        totalUSD * dolar;


      /* MOSTRAR RESULTADO */

      resultado.innerHTML =

        "$ " +

        totalARS.toLocaleString(

          "es-AR",

          {

            minimumFractionDigits: 0,

            maximumFractionDigits: 0

          }

        );


      resultado.style.display =
        "block";


      /* MOSTRAR AVISO */

      aviso.style.display =
        "block";

    }


    /* COTIZAR CON ENTER */

    document
      .getElementById("precioUSD")
      .addEventListener(

        "keydown",

        function(event) {

          if (
            event.key === "Enter"
          ) {

            cotizar();

          }

        }

      );


  </script>

</body>
</html>
