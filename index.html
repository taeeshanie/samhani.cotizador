# Samahani Cotizador

```html
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Samahani Cotizador</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Yeseva+One&display=swap"
    rel="stylesheet"
  >

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 20px 15px 180px;

      display: flex;
      flex-direction: column;
      align-items: center;

      font-family: "Yeseva One", serif;

      background-image: url("fondo.png");
      background-size: cover;
      background-position: center top;
      background-repeat: no-repeat;
      background-attachment: fixed;
    }


    /* =========================
       DECORACIÓN SUPERIOR
    ========================= */

    .decoracion {
      width: 100%;
      max-width: 650px;
      margin-bottom: 30px;
      text-align: center;
    }

    .decoracion img {
      width: 100%;
      height: auto;
      display: block;
    }


    /* =========================
       CONTENEDOR GENERAL
    ========================= */

    .apple-wrapper {
      position: relative;

      width: min(92vw, 480px);

      margin-top: 85px;
      padding-top: 25px;
    }


    /* =========================
       TALLO
    ========================= */

    .apple-wrapper::before {
      content: "";

      position: absolute;

      width: 30px;
      height: 100px;

      top: -70px;
      left: 48%;

      background: #713415;

      border-radius: 20px;

      transform: rotate(-18deg);

      z-index: 10;
    }


    /* =========================
       HOJA
    ========================= */

    .apple-wrapper::after {
      content: "";

      position: absolute;

      width: 105px;
      height: 55px;

      top: -55px;
      left: 50%;

      background: #5d941d;

      border-radius: 100% 0 100% 0;

      transform: rotate(-25deg);

      z-index: 9;
    }


    /* =========================
       CUERPO DE LA MANZANA
    ========================= */

    .apple {

      position: relative;

      width: 100%;

      min-height: 590px;

      padding: 75px 38px 55px;

      background:
        radial-gradient(
          circle at 28% 22%,
          #ff7777 0%,
          #e63232 30%,
          #c41414 65%,
          #9f0d0d 100%
        );

      /*
      FORMA PRINCIPAL
      */

      border-radius:
        46% 46% 48% 48%
        /
        30% 30% 58% 58%;

      border: 7px solid #a90f0f;

      box-shadow:
        inset 15px 15px 25px rgba(255,255,255,0.18),
        inset -18px -18px 30px rgba(80,0,0,0.3),
        0 18px 35px rgba(0,0,0,0.25);
    }


    /*
    LÓBULO IZQUIERDO
    */

    .apple-lobe-left {

      position: absolute;

      width: 55%;
      height: 180px;

      top: -35px;
      left: 0;

      background: #d82020;

      border-radius: 50%;

      z-index: -1;
    }


    /*
    LÓBULO DERECHO
    */

    .apple-lobe-right {

      position: absolute;

      width: 55%;
      height: 180px;

      top: -35px;
      right: 0;

      background: #d82020;

      border-radius: 50%;

      z-index: -1;
    }


    /* =========================
       BRILLO
    ========================= */

    .apple-shine {

      position: absolute;

      width: 65px;
      height: 210px;

      top: 100px;
      left: 38px;

      border-radius: 50%;

      background: linear-gradient(
        90deg,
        rgba(255,255,255,0.32),
        rgba(255,255,255,0)
      );

      transform: rotate(18deg);

      pointer-events: none;
    }


    /* =========================
       PANEL CREMA
    ========================= */

    .apple-inner {

      position: relative;

      z-index: 5;

      width: 100%;

      min-height: 430px;

      padding: 45px 25px;

      display: flex;
      flex-direction: column;
      justify-content: center;

      background: #fff9e8;

      border-radius:
        40% 40% 42% 42%
        /
        30% 30% 50% 50%;

      box-shadow:
        inset 0 0 25px rgba(120,90,30,0.1);
    }


    /* =========================
       INPUT
    ========================= */

    .input-usd {

      width: 100%;

      padding: 18px;

      border: 3px solid #9c2420;

      border-radius: 18px;

      background: white;

      color: #4a332c;

      font-family: "Yeseva One", serif;

      font-size: 20px;

      text-align: center;

      outline: none;
    }

    .input-usd:focus {
      border-color: #5d941d;

      box-shadow:
        0 0 0 4px
        rgba(93,148,29,0.18);
    }


    /* =========================
       BOTÓN
    ========================= */

    button {

      width: 100%;

      margin-top: 20px;

      padding: 18px;

      border: none;

      border-radius: 18px;

      background: #5d941d;

      color: white;

      font-family: "Yeseva One", serif;

      font-size: 21px;

      cursor: pointer;

      box-shadow:
        0 6px 0 #3f6712;
    }

    button:hover {
      transform: translateY(-2px);
    }

    button:active {
      transform: translateY(3px);

      box-shadow:
        0 3px 0 #3f6712;
    }


    /* =========================
       RESULTADO
    ========================= */

    .resultado {

      display: none;

      margin-top: 25px;

      padding: 25px 12px;

      border: 2px dashed #8e1b1b;

      border-radius: 22px;

      color: #8e1b1b;

      background: rgba(255,255,255,0.55);

      font-size: 34px;

      text-align: center;
    }


    /* =========================
       AVISO
    ========================= */

    .aviso {

      display: none;

      margin-top: 16px;

      padding: 12px 8px;

      color: #8e1b1b;

      font-family: Arial, sans-serif;

      font-size: 12px;

      font-weight: bold;

      line-height: 1.5;

      text-align: center;
    }


    /* =========================
       ERROR
    ========================= */

    .error {

      display: none;

      margin-top: 18px;

      color: #8e1b1b;

      font-family: Arial, sans-serif;

      font-size: 14px;

      font-weight: bold;

      text-align: center;
    }


    /* =========================
       CELULAR
    ========================= */

    @media (max-width: 500px) {

      body {
        padding: 15px 10px 160px;
      }

      .apple-wrapper {
        width: 95vw;
        margin-top: 65px;
      }

      .apple {
        min-height: 540px;
        padding: 65px 24px 40px;
      }

      .apple-inner {
        min-height: 410px;
        padding: 35px 20px;
      }

      .resultado {
        font-size: 29px;
      }

    }

  </style>
</head>


<body>

  <!-- IMAGEN DECORATIVA -->
  <div class="decoracion">
    <img
      src="decoracion.png"
      alt="Samahani"
    >
  </div>


  <!-- MANZANA -->
  <div class="apple-wrapper">

    <div class="apple">

      <!-- LÓBULOS SUPERIORES -->
      <div class="apple-lobe-left"></div>
      <div class="apple-lobe-right"></div>

      <!-- BRILLO -->
      <div class="apple-shine"></div>


      <!-- INTERIOR -->
      <div class="apple-inner">

        <input
          type="number"
          id="precioUSD"
          class="input-usd"
          placeholder="Precio en USD"
          min="0"
          step="0.01"
        >


        <button onclick="cotizar()">
          COTIZAR
        </button>


        <div
          id="resultado"
          class="resultado"
        ></div>


        <div
          id="aviso"
          class="aviso"
        >
          Los precios que se muestran solo incluyen fees.
          El envío a casilla japonesa se cobra por aparte,
          ya que depende del peso y la cantidad de items
          que entren en el envío.
        </div>


        <div
          id="error"
          class="error"
        >
          Ingresá un precio válido.
        </div>

      </div>

    </div>

  </div>


  <script>

    function cotizar() {

      const precio = parseFloat(
        document.getElementById("precioUSD").value
      );

      const fees = 3.50;
      const dolar = 1530;

      const resultado =
        document.getElementById("resultado");

      const aviso =
        document.getElementById("aviso");

      const error =
        document.getElementById("error");


      if (isNaN(precio) || precio <= 0) {

        resultado.style.display = "none";
        aviso.style.display = "none";
        error.style.display = "block";

        return;
      }


      error.style.display = "none";


      const totalUSD = precio + fees;
      const totalARS = totalUSD * dolar;


      resultado.innerHTML =
        "$ " +
        totalARS.toLocaleString(
          "es-AR",
          {
            minimumFractionDigits: 0,
            maximumFractionDigits: 0
          }
        );


      resultado.style.display = "block";
      aviso.style.display = "block";

    }

  </script>

</body>
</html>
```
