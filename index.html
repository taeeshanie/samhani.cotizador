<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>🍎🍀SAMHANI COTIZADOR🍀🍎</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: transparent;
      font-family: Arial, sans-serif;
    }

    .cotizador {
      width: 100%;
      max-width: 420px;
      padding: 25px;
      text-align: center;
    }

    h1 {
      margin: 0 0 25px 0;
      font-size: 27px;
      font-weight: bold;
    }

    .input-usd {
      width: 100%;
      padding: 16px;
      border: 2px solid #222;
      border-radius: 12px;
      font-size: 20px;
      text-align: center;
      outline: none;
    }

    .input-usd:focus {
      border-color: #7b61ff;
    }

    button {
      width: 100%;
      margin-top: 15px;
      padding: 16px;
      border: none;
      border-radius: 12px;
      background: #222;
      color: white;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.9;
    }

    .resultado {
      margin-top: 25px;
      font-size: 28px;
      font-weight: bold;
      display: none;
    }

    .error {
      margin-top: 15px;
      color: #d00000;
      font-size: 15px;
      display: none;
    }
  </style>
</head>

<body>

  <div class="cotizador">

    <h1>🍎🍀SAMHANI COTIZADOR🍀🍎</h1>

    <input
      type="number"
      id="precioUSD"
      class="input-usd"
      placeholder="Precio en USD"
      min="0"
      step="0.01"
    >

    <button onclick="cotizar()">
      COTIZAR
    </button>

    <div id="error" class="error">
      Ingresá un precio válido.
    </div>

    <div id="resultado" class="resultado"></div>

  </div>

  <script>
    function cotizar() {

      const precio = parseFloat(
        document.getElementById("precioUSD").value
      );

      const fees = 3.50;
      const dolar = 1530;

      const resultado = document.getElementById("resultado");
      const error = document.getElementById("error");

      if (isNaN(precio) || precio <= 0) {
        resultado.style.display = "none";
        error.style.display = "block";
        return;
      }

      error.style.display = "none";

      const totalUSD = precio + fees;
      const totalARS = totalUSD * dolar;

      resultado.innerHTML =
        "$" + totalARS.toLocaleString("es-AR");

      resultado.style.display = "block";
    }
  </script>

</body>
</html>
